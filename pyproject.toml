[project]
name = "exifmodern"
version = "0.1.0"
description = "ExifTool-compatible metadata CLI and runtime library in modern Python"
readme = "README.md"
license-files = ["LICENSE"]
authors = [
    { name = "Matt Stancliff", email = "matt@genges.com" }
]
requires-python = ">=3.14"
dependencies = [
    "lark>=1.3.1",
]
keywords = ["exif", "metadata", "exiftool", "iptc", "xmp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]

[project.scripts]
exifmodern = "exifmodern.public_interface.cli_main:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
